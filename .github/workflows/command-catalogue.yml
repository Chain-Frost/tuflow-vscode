name: Command catalogue and parser

on:
  pull_request:
    paths:
      - 'src/commands/**'
      - 'src/extension.ts'
      - 'src/test/commandCatalogue.test.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/command-catalogue.yml'
  workflow_dispatch:

jobs:
  catalogue-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: node --test out/test/commandCatalogue.test.js

name: Grammar fixtures

on:
  pull_request:
    paths:
      - '.github/workflows/grammar.yml'
      - 'syntaxes/tuflow.tmLanguage.json'
      - 'language-configuration.json'
      - 'test/grammar.test.cjs'
      - 'test/textmate.check.cjs'
      - 'test/fixtures/grammar-cases.json'
      - 'test/language-registration.test.cjs'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [master]
    paths:
      - '.github/workflows/grammar.yml'
      - 'syntaxes/tuflow.tmLanguage.json'
      - 'language-configuration.json'
      - 'test/grammar.test.cjs'
      - 'test/textmate.check.cjs'
      - 'test/fixtures/grammar-cases.json'
      - 'test/language-registration.test.cjs'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check grammar and indentation fixtures
        run: node --test test/grammar.test.cjs
      - name: Install isolated TextMate tokenizer test libraries
        run: npm install --no-save --package-lock=false --prefix .grammar-test-deps vscode-textmate@9.3.2 vscode-oniguruma@2.0.1
      - name: Verify TextMate and Oniguruma tokenisation
        run: NODE_PATH="$PWD/.grammar-test-deps/node_modules" node --test test/textmate.check.cjs

  helper-regression:
    name: Helper build, lint and registration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run compile
      - name: Lint
        run: npm run lint
      - name: Run registration and language-ID tests
        run: npm run test:registration
      - name: Full Helper unit and VS Code Extension Host suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Full Helper unit and VS Code Extension Host suite (Windows)
        if: runner.os == 'Windows'
        run: npm test

  qa-vsix:
    name: Package and inspect exact PR-head VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head, not GitHub's synthetic PR merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact source SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "QA VSIX source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install locked dependencies
        run: npm ci
      - name: Package VSIX with repository's verification script (no publication)
        run: npm run package:vsix
      - name: Verify packaged shared language and grammar resources
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import zipfile

          with zipfile.ZipFile("tuflow-helper.vsix") as z:
              names = set(z.namelist())
              required = {
                  "extension/package.json",
                  "extension/out/extension.js",
                  "extension/language-configuration.json",
                  "extension/syntaxes/tuflow.tmLanguage.json",
                  "extension/snippets/tuflow.json",
              }
              assert not required - names, f"Missing VSIX resources: {required - names}"
              manifest = json.loads(z.read("extension/package.json"))
              assert manifest["contributes"]["languages"][0]["id"] == "tuflow"
              assert manifest["contributes"]["grammars"][0]["language"] == "tuflow"
              assert manifest["contributes"]["grammars"][0]["scopeName"] == "source.tuflow"
          PY
          sha256sum tuflow-helper.vsix | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain exact-head QA VSIX for local Windows co-install tests
        uses: actions/upload-artifact@v4
        with:
          name: tuflow-helper-pr17-qa-vsix
          path: tuflow-helper.vsix
          retention-days: 14
          if-no-files-found: error

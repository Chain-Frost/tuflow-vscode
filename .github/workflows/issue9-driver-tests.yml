name: Issue 9 supplemental driver regression tests

on:
  pull_request:
    paths:
      - 'docs/acceptance/windows-2026-11-24/drivers/**'
      - '.github/workflows/issue9-driver-tests.yml'

permissions:
  contents: read

jobs:
  python-driver-tests:
    name: Python 3.14 local driver (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Validate driver syntax
        run: python -m compileall -q docs/acceptance/windows-2026-11-24/drivers
      - name: Test report freshness and failure propagation
        run: python -m unittest discover -s docs/acceptance/windows-2026-11-24/drivers -p 'test_run_local.py' -v

name: TUFLOW UX acceptance fixtures

on:
  pull_request:
    paths:
      - 'test/acceptance/**'
      - '.github/workflows/acceptance-fixtures.yml'
  workflow_dispatch:

jobs:
  fixture-integrity:
    name: Fixture integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fixture matrix and references
        run: node test/acceptance/check-fixtures.mjs
      - name: Run acceptance assertion unit tests
        run: node --test test/acceptance/assertions.test.cjs test/acceptance/compare-reports.test.cjs
      - name: Check acceptance script syntax
        run: |
          node --check test/acceptance/vscode-runner.cjs
          node --check test/acceptance/run-host.cjs
          node --check test/acceptance/assertions.cjs
          node --check test/acceptance/compare-reports.mjs

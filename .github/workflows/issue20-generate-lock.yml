name: Issue 20 lockfile regeneration (temporary; remove before merge)

# One-time branch-only bootstrap: the chat environment has no npm registry access.
# NEVER merge this workflow. It is restricted to the owner's internal issue-20 PR.
on:
  pull_request:
    branches: [master]
    paths:
      - 'package.json'
      - '.github/workflows/issue20-generate-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/issue-20-dependency-security'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/issue-20-dependency-security
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve dependencies and regenerate lockfile without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Capture exact security-advisory graph
        shell: bash
        run: |
          npm audit --json > issue20-npm-audit.json || true
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('issue20-npm-audit.json')); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,via:v.via,range:v.range,fixAvailable:v.fixAvailable})).slice(0,60)},null,2))"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue20-npm-audit
          path: issue20-npm-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit lockfile back to the exact owning branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(issue-20): regenerate npm dependency lockfile'
            git push origin HEAD:chore/issue-20-dependency-security
          fi
